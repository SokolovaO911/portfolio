<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get in Touch — Olha Sokolova, Junior UI/UX Designer</title>
  <meta name="description" content="Have a question or a project in mind? Send a message to Olha Sokolova, junior UI/UX designer in Freiburg.">
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Olha Sokolova — home"><span>S</span>D</a>
    <nav class="nav" aria-label="Main">
      <a href="index.html#projects">Projects</a>
      <a href="about.html">About Me</a>
      <a href="contacts.html">Contact</a>
    </nav>
    <a class="btn btn--brush" href="get-in-touch.html" aria-current="page"><span>Get in Touch</span></a>
  </header>

  <main class="touch" id="top">
    <h1 class="touch__title">Have a question or a project in mind?</h1>

    <figure class="touch__photo">
      <img src="assets/contact-photo.jpg?v=9" alt="Portrait of Olha Sokolova with a mountain landscape behind her" width="1000" height="1333">
      <img class="touch__squiggle" src="assets/squiggle.png?v=9" alt="" aria-hidden="true">
    </figure>

    <form class="touch__form" id="touch-form" novalidate>
      <div class="field">
        <label for="f-name">Your name *</label>
        <input id="f-name" name="name" type="text" placeholder="Your name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="f-email">Email address *</label>
        <input id="f-email" name="email" type="email" placeholder="Your email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="f-message">Your message *</label>
        <textarea id="f-message" name="message" rows="6" placeholder="Text here.." required></textarea>
      </div>
      <button class="btn btn--brush btn--wide" type="submit"><span>Send message</span></button>
      <p class="touch__note" id="touch-note" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js?v=10"></script>
</body>
</html>
